<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shattered Mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            background: linear-gradient(135deg, #2a2a3e 0%, #3a4a5e 100%);
            cursor: default;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            transition: filter 1s ease;
        }

        #canvas.shattered {
            filter: sepia(0.25) contrast(1.15) brightness(0.75);
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #back-button {
            position: absolute;
            top: 40px;
            left: 40px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 16px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border-radius: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateX(-5px);
        }

        #back-button.visible {
            opacity: 1;
        }

        #title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 48px;
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
        }

        #title.hidden {
            opacity: 0;
        }

        #instruction {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
            letter-spacing: 2px;
        }

        #instruction.hidden {
            opacity: 0;
        }

        #finding-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 32px;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            font-style: italic;
        }

        #finding-text.visible {
            opacity: 1;
        }

        #scene-hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            letter-spacing: 2px;
            font-style: italic;
        }

        #scene-hint.visible {
            opacity: 1;
        }

        .scene-title {
            position: absolute;
            top: 40px;
            right: 40px;
            color: white;
            font-size: 24px;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
            pointer-events: none;
        }

        .scene-title.visible {
            opacity: 1;
        }

        #scene-progress {
            position: absolute;
            top: 75px;
            right: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            opacity: 0;
            transition: opacity 1s ease;
            letter-spacing: 2px;
            pointer-events: none;
            font-style: italic;
        }

        #scene-progress.visible {
            opacity: 1;
        }

        #fragment-description {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            letter-spacing: 1px;
            max-width: 500px;
            line-height: 1.6;
            font-style: italic;
        }

        #fragment-description.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui-overlay">
        <div id="title">The Shattered Mirror</div>
        <div id="instruction">Click the mirror to shatter it</div>
        <div id="finding-text">Finding, bringing back lost pieces</div>
        <button id="back-button">← Back</button>
        <div id="scene-title" class="scene-title"></div>
        <div id="scene-progress"></div>
        <div id="scene-hint">Drag to explore, bring back the mirror shards</div>
        <div id="fragment-description"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // State management
        const STATE = {
            MIRROR: 'mirror',
            FRAGMENTS: 'fragments',
            SCENE: 'scene',
            TRANSITIONING: 'transitioning'
        };

        let currentState = STATE.MIRROR;
        let scene, camera, renderer, raycaster, mouse;
        let mirror, fragments = [];
        let currentScene = null;
        let hoveredFragment = null;
        let initialFragmentData = []; // Store initial fragment configurations
        let controls; // OrbitControls for scene navigation
        let sceneFragmentShape = null; // The clickable fragment shape in the scene

        // Scene definitions
        const scenes = [
            {
                name: 'Frozen Memory',
                description: 'Where time crystallizes into still moments, suspended in eternal ice',
                color: 0x89CFF0,
                filter: 'cold',
                fogColor: 0xb8e0f5,
                ambientLight: 0x6699cc
            },
            {
                name: 'Golden Hours',
                description: 'Ribbons of light dance through amber warmth, weaving forgotten dreams',
                color: 0xe8a735,
                filter: 'warm',
                fogColor: 0xffd9a3,
                ambientLight: 0xffaa55
            },
            {
                name: 'Shadow Play',
                description: 'Stark contrasts dance in monochrome, a film noir reverie',
                color: 0x2a2a2a,
                filter: 'noir',
                fogColor: 0x333333,
                ambientLight: 0x444444
            },
            {
                name: 'Dream Drift',
                description: 'Reality bends and softens at the edges, ethereal and weightless',
                color: 0xb19cd9,
                filter: 'dreamy',
                fogColor: 0xdda0dd,
                ambientLight: 0xaa88cc
            },
            {
                name: 'Infinity',
                description: 'Endless stairs spiral through transparent realms of possibility',
                color: 0xf0f0f5,
                filter: 'infinity',
                fogColor: 0xe8e8f0,
                ambientLight: 0xccccdd
            },
            {
                name: 'Twilight',
                description: 'Between day and night, crystalline forms glow with fading light',
                color: 0xff8c42,
                filter: 'twilight',
                fogColor: 0xffa566,
                ambientLight: 0xff9955
            },
            {
                name: 'Echo',
                description: 'Verdant rings ripple outward, carrying whispers through time',
                color: 0x2d8659,
                filter: 'echo',
                fogColor: 0x7cb892,
                ambientLight: 0x66bb88
            }
        ];

        // Track completed scenes
        let completedScenes = new Set();

        // Audio context for sound effects
        let audioContext;

        // Play shatter sound effect
        function playShatterSound() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const now = audioContext.currentTime;

            // Create multiple oscillators for crisp glass-like sound
            for (let i = 0; i < 10; i++) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                // Higher frequencies for crisper glass-like sound
                oscillator.frequency.setValueAtTime(2000 + Math.random() * 2500, now);
                oscillator.frequency.exponentialRampToValueAtTime(300 + Math.random() * 400, now + 0.15);

                // Fade out very quickly for crisp effect
                gainNode.gain.setValueAtTime(0.04, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.start(now + i * 0.015);
                oscillator.stop(now + 0.3);
            }
        }

        // Initialize
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x3a4a5e, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('canvas'),
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Raycaster for mouse interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Create initial mirror
            createMirror();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onClick);
            window.addEventListener('mousemove', onMouseMove);
            document.getElementById('back-button').addEventListener('click', onBackClick);

            // Start animation loop
            animate();
        }

        // Create the initial mirror (3:4 aspect ratio - vertical)
        function createMirror() {
            const geometry = new THREE.PlaneGeometry(3, 4, 1, 1);
            const material = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                metalness: 1,
                roughness: 0.1,
                emissive: 0x222222
            });

            mirror = new THREE.Mesh(geometry, material);
            scene.add(mirror);

            // Add frame
            const frameGeometry = new THREE.PlaneGeometry(3.3, 4.3, 1, 1);
            const frameMaterial = new THREE.MeshStandardMaterial({
                color: 0x3a3a3a,
                metalness: 0.8,
                roughness: 0.3
            });
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.position.z = -0.1;
            mirror.add(frame);

            // Lighting for mirror - bright and clear
            const ambientLight = new THREE.AmbientLight(0xaaaaaa, 1.8);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight1.position.set(5, 5, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xccddff, 0.5);
            directionalLight2.position.set(-5, -3, 3);
            scene.add(directionalLight2);

            const directionalLight3 = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight3.position.set(0, -5, 2);
            scene.add(directionalLight3);
        }

        // Shatter the mirror into fragments
        function shatterMirror() {
            if (currentState !== STATE.MIRROR) return;

            currentState = STATE.TRANSITIONING;

            // Hide title and instruction first
            document.getElementById('title').classList.add('hidden');
            document.getElementById('instruction').classList.add('hidden');

            // Add film grain filter and darken scene
            document.getElementById('canvas').classList.add('shattered');

            // Wait 1 second, then show finding text
            setTimeout(() => {
                document.getElementById('finding-text').classList.add('visible');
            }, 1000);

            // Play shatter sound
            playShatterSound();

            // Camera zoom in animation
            const duration = 1500;
            const startTime = Date.now();
            const startZ = camera.position.z;
            const targetZ = 4; // Move camera closer

            function cameraZoom() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                camera.position.z = startZ + (targetZ - startZ) * eased;

                if (progress < 1) {
                    requestAnimationFrame(cameraZoom);
                } else {
                    // Hide finding text after it's been shown for 1 second
                    setTimeout(() => {
                        document.getElementById('finding-text').classList.remove('visible');
                    }, 2000); // 1s delay + 1s display
                }
            }

            cameraZoom();

            // Remove original mirror
            scene.remove(mirror);

            createFragmentsWithAnimation();
        }

        // Create fragments with shatter animation
        function createFragmentsWithAnimation() {
            // Clear any existing fragments
            fragments.forEach(f => scene.remove(f.mesh));
            fragments = [];

            // Create 7 fragments based on SVG
            const fragmentCount = 7;

            // Save initial configuration on first shatter
            if (initialFragmentData.length === 0) {
                for (let i = 0; i < fragmentCount; i++) {
                    const fragment = createFragment(i, fragmentCount);
                    fragments.push(fragment);
                    scene.add(fragment.mesh);

                    // Save the configuration
                    initialFragmentData.push({
                        targetPos: { ...fragment.targetPos },
                        rotation: { ...fragment.rotation },
                        rotationSpeed: { ...fragment.rotationSpeed }
                    });

                    // Animate fragment breaking apart
                    animateFragmentShatter(fragment, i);
                }
            } else {
                // Use saved configuration
                for (let i = 0; i < fragmentCount; i++) {
                    const fragment = createFragment(i, fragmentCount);

                    // Override random values with saved ones
                    fragment.targetPos = { ...initialFragmentData[i].targetPos };
                    fragment.rotation = { ...initialFragmentData[i].rotation };
                    fragment.rotationSpeed = { ...initialFragmentData[i].rotationSpeed };

                    fragments.push(fragment);
                    scene.add(fragment.mesh);

                    // Animate fragment breaking apart
                    animateFragmentShatter(fragment, i);
                }
            }

            setTimeout(() => {
                currentState = STATE.FRAGMENTS;
            }, 1500);
        }

        // Recreate fragments instantly (for back button)
        function recreateFragments() {
            // Clear any existing fragments
            fragments.forEach(f => scene.remove(f.mesh));
            fragments = [];

            // Create 7 fragments
            const fragmentCount = 7;

            for (let i = 0; i < fragmentCount; i++) {
                const fragment = createFragment(i, fragmentCount);

                // Use saved configuration to maintain consistency
                if (initialFragmentData[i]) {
                    fragment.targetPos = { ...initialFragmentData[i].targetPos };
                    fragment.rotation = { ...initialFragmentData[i].rotation };
                    fragment.rotationSpeed = { ...initialFragmentData[i].rotationSpeed };
                }

                fragments.push(fragment);
                scene.add(fragment.mesh);

                // If scene is completed, place at original position
                if (completedScenes.has(fragment.sceneIndex)) {
                    fragment.mesh.position.set(
                        fragment.originalPos.x,
                        fragment.originalPos.y,
                        fragment.originalPos.z
                    );
                    fragment.mesh.rotation.set(0, 0, 0);
                    fragment.restRotation = { x: 0, y: 0, z: 0 };
                    fragment.completed = true;
                } else {
                    // Set to scattered position
                    fragment.mesh.position.set(
                        fragment.targetPos.x,
                        fragment.targetPos.y,
                        fragment.targetPos.z
                    );
                    fragment.mesh.rotation.set(
                        fragment.rotation.x,
                        fragment.rotation.y,
                        fragment.rotation.z
                    );
                    // Save current rotation as rest position
                    fragment.restRotation.x = fragment.rotation.x;
                    fragment.restRotation.y = fragment.rotation.y;
                    fragment.restRotation.z = fragment.rotation.z;
                }
            }

            // Check if all scenes completed - restore mirror
            if (completedScenes.size === scenes.length) {
                restoreMirror();
            } else {
                currentState = STATE.FRAGMENTS;
            }
        }

        // SVG fragment path data (from mirror.svg, converted to Three.js coordinates)
        // SVG is 427x568, mirror is 3x4, centered at 0,0
        function svgToThree(svgX, svgY) {
            // Convert SVG coords (0,0 top-left) to Three.js (0,0 center)
            const x = (svgX / 427) * 3 - 1.5;
            const y = -(svgY / 568) * 4 + 2;
            return { x, y };
        }

        // Create an irregular fragment based on SVG path
        function createFragment(index, total) {
            const shape = new THREE.Shape();

            // SVG path data for each of the 7 fragments (simplified points)
            const fragmentPaths = [
                // Fragment 0: Bottom-left large piece
                [[0.5, 428.55], [0.67, 567.43], [198.73, 567.43], [206.53, 533.6], [172.84, 381.9], [206.53, 295.72], [188.92, 279.34], [124.97, 317.09]],
                // Fragment 1: Bottom-right piece
                [[425.87, 567.43], [425.87, 537.67], [206.53, 295.72], [172.84, 381.9], [206.53, 533.6], [198.73, 567.43]],
                // Fragment 2: Right middle-bottom piece
                [[425.87, 332.16], [321.08, 329.55], [226.39, 295.72], [206.53, 295.72], [425.87, 537.67]],
                // Fragment 3: Right middle-top piece
                [[425.87, 95.82], [215.04, 279.36], [206.53, 295.72], [226.39, 295.72], [321.08, 329.55], [425.87, 332.16]],
                // Fragment 4: Top-right piece
                [[198.73, 0.5], [226.39, 146.51], [215.04, 279.36], [425.87, 95.82], [425.87, 0.5]],
                // Fragment 5: Top-left piece
                [[0.5, 62.11], [86.32, 183.9], [206.53, 295.72], [215.04, 279.36], [226.39, 146.51], [198.73, 0.5], [0.5, 0.5]],
                // Fragment 6: Left side piece
                [[0.5, 428.55], [124.97, 317.09], [188.92, 279.34], [86.32, 183.9], [0.5, 62.11]]
            ];

            const points = fragmentPaths[index];
            points.forEach((point, i) => {
                const converted = svgToThree(point[0], point[1]);
                if (i === 0) {
                    shape.moveTo(converted.x, converted.y);
                } else {
                    shape.lineTo(converted.x, converted.y);
                }
            });
            shape.closePath();

            const extrudeSettings = {
                depth: 0.05,
                bevelEnabled: true,
                bevelThickness: 0.02,
                bevelSize: 0.02,
                bevelSegments: 2
            };

            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const material = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                metalness: 1,
                roughness: 0.1,
                emissive: 0x111111,
                side: THREE.DoubleSide
            });

            const mesh = new THREE.Mesh(geometry, material);

            // Calculate centroid of fragment for positioning
            let centroidX = 0, centroidY = 0;
            points.forEach(point => {
                const converted = svgToThree(point[0], point[1]);
                centroidX += converted.x;
                centroidY += converted.y;
            });
            centroidX /= points.length;
            centroidY /= points.length;

            // Start at origin (will look like intact mirror initially)
            mesh.position.set(0, 0, 0);

            // Spread fragments outward from their centroid positions
            // Use different spread factors for horizontal and vertical
            const spreadFactorX = 3.2;  // More horizontal spread
            const spreadFactorY = 1.6;  // Less vertical spread
            const targetX = centroidX * spreadFactorX;
            const targetY = centroidY * spreadFactorY;
            const targetZ = (Math.random() - 0.5) * 1.0;

            return {
                mesh: mesh,
                originalPos: { x: 0, y: 0, z: 0 },
                centroid: { x: centroidX, y: centroidY },
                targetPos: {
                    x: targetX,
                    y: targetY,
                    z: targetZ
                },
                rotation: {
                    x: (Math.random() - 0.5) * 0.4,
                    y: (Math.random() - 0.5) * 0.4,
                    z: (Math.random() - 0.5) * 0.4
                },
                rotationSpeed: {
                    x: (Math.random() - 0.5) * 0.012,
                    y: (Math.random() - 0.5) * 0.012,
                    z: (Math.random() - 0.5) * 0.012
                },
                restRotation: { x: 0, y: 0, z: 0 }, // Will store final rotation after shatter
                sceneIndex: index,
                hovered: false,
                completed: false,
                swayPhase: Math.random() * Math.PI * 2
            };
        }

        // Animate fragment shattering
        function animateFragmentShatter(fragment, index) {
            const duration = 1000;
            const delay = index * 50;
            const startTime = Date.now() + delay;

            function animate() {
                const now = Date.now();
                const elapsed = now - startTime;

                if (elapsed < 0) {
                    requestAnimationFrame(animate);
                    return;
                }

                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    const eased = easeOutCubic(progress);

                    fragment.mesh.position.x = fragment.originalPos.x +
                        (fragment.targetPos.x - fragment.originalPos.x) * eased;
                    fragment.mesh.position.y = fragment.originalPos.y +
                        (fragment.targetPos.y - fragment.originalPos.y) * eased;
                    fragment.mesh.position.z = fragment.originalPos.z +
                        (fragment.targetPos.z - fragment.originalPos.z) * eased;

                    // Continuous rotation during shatter animation
                    fragment.mesh.rotation.x += fragment.rotationSpeed.x;
                    fragment.mesh.rotation.y += fragment.rotationSpeed.y;
                    fragment.mesh.rotation.z += fragment.rotationSpeed.z;

                    requestAnimationFrame(animate);
                } else {
                    // Save final rotation as rest position
                    fragment.restRotation.x = fragment.mesh.rotation.x;
                    fragment.restRotation.y = fragment.mesh.rotation.y;
                    fragment.restRotation.z = fragment.mesh.rotation.z;
                }
            }

            animate();
        }

        // Easing function
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Handle mouse move for hover effects
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (currentState === STATE.FRAGMENTS) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(fragments.map(f => f.mesh));

                const descriptionElement = document.getElementById('fragment-description');

                // Reset previous hovered fragment
                if (hoveredFragment && !intersects.find(i => i.object === hoveredFragment.mesh)) {
                    hoveredFragment.hovered = false;
                    hoveredFragment = null;
                    descriptionElement.classList.remove('visible');
                }

                // Set new hovered fragment
                if (intersects.length > 0) {
                    const fragment = fragments.find(f => f.mesh === intersects[0].object);
                    if (fragment) {
                        fragment.hovered = true;
                        hoveredFragment = fragment;
                        document.body.style.cursor = 'pointer';

                        // Show scene description only for uncompleted fragments
                        if (!fragment.completed) {
                            const sceneData = scenes[fragment.sceneIndex];
                            descriptionElement.textContent = sceneData.description;
                            descriptionElement.classList.add('visible');
                        }
                    }
                } else {
                    document.body.style.cursor = 'default';
                    descriptionElement.classList.remove('visible');
                }
            }
        }

        // Handle click events
        function onClick(event) {
            if (currentState === STATE.MIRROR) {
                shatterMirror();
            } else if (currentState === STATE.FRAGMENTS) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(fragments.map(f => f.mesh));

                if (intersects.length > 0) {
                    const fragment = fragments.find(f => f.mesh === intersects[0].object);
                    if (fragment) {
                        transitionToScene(fragment);
                    }
                }
            } else if (currentState === STATE.SCENE) {
                // Check if clicking on fragment shape in scene
                raycaster.setFromCamera(mouse, camera);
                if (sceneFragmentShape) {
                    const intersects = raycaster.intersectObject(sceneFragmentShape);
                    if (intersects.length > 0) {
                        onFragmentShapeClicked();
                    }
                }
            }
        }

        // Handle clicking fragment shape in scene
        function onFragmentShapeClicked() {
            if (currentState !== STATE.SCENE) return;

            // Mark scene as completed
            completedScenes.add(window.currentSceneIndex);

            // Disable controls
            if (controls) {
                controls.enabled = false;
            }

            // Zoom to fragment with animation
            const duration = 1000;
            const startTime = Date.now();
            const startPos = camera.position.clone();
            const targetPos = sceneFragmentShape.position.clone();
            targetPos.z += 2; // Move camera closer

            function zoomToFragment() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                camera.position.lerpVectors(startPos, targetPos, eased);
                camera.lookAt(sceneFragmentShape.position);

                if (progress < 1) {
                    requestAnimationFrame(zoomToFragment);
                } else {
                    // After zoom, return to fragment selection
                    setTimeout(() => {
                        returnToFragmentSelection();
                    }, 500);
                }
            }

            zoomToFragment();
        }

        // Return to fragment selection from scene
        function returnToFragmentSelection() {
            currentState = STATE.TRANSITIONING;
            document.getElementById('back-button').classList.remove('visible');
            document.getElementById('scene-title').classList.remove('visible');
            document.getElementById('scene-progress').classList.remove('visible');
            document.getElementById('scene-hint').classList.remove('visible');

            // Fade out scene
            const duration = 1000;
            const startTime = Date.now();

            function fadeOut() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                if (currentScene) {
                    currentScene.forEach(obj => {
                        if (obj.material) {
                            obj.material.transparent = true;
                            obj.material.opacity = 1 - progress;
                        }
                    });
                }

                if (sceneFragmentShape) {
                    sceneFragmentShape.material.opacity = 0.9 * (1 - progress);
                }

                if (progress < 1) {
                    requestAnimationFrame(fadeOut);
                } else {
                    // Clear scene
                    if (currentScene) {
                        currentScene.forEach(obj => scene.remove(obj));
                        currentScene = null;
                    }
                    if (sceneFragmentShape) {
                        scene.remove(sceneFragmentShape);
                        sceneFragmentShape = null;
                    }

                    // Reset scene
                    scene.background = null;
                    scene.fog = new THREE.Fog(0x3a4a5e, 10, 50);

                    // Reset camera
                    camera.position.set(0, 0, 5);
                    camera.lookAt(0, 0, 0);

                    // Re-add film grain filter for fragment selection
                    document.getElementById('canvas').classList.add('shattered');

                    // Recreate fragments instantly
                    recreateFragments();
                }
            }

            fadeOut();
        }

        // Transition from fragment to scene
        function transitionToScene(fragment) {
            if (currentState !== STATE.FRAGMENTS) return;
            if (fragment.completed) return; // Don't enter completed scenes

            currentState = STATE.TRANSITIONING;
            document.body.style.cursor = 'default';
            document.getElementById('fragment-description').classList.remove('visible');

            const sceneData = scenes[fragment.sceneIndex];
            const currentFragmentIndex = fragments.indexOf(fragment);

            const duration = 1500;
            const startTime = Date.now();
            const startCameraZ = camera.position.z;
            const targetCameraZ = fragment.mesh.position.z + 0.5;

            // Zoom animation
            function zoomAnimate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                // Zoom camera to fragment
                camera.position.z = startCameraZ + (targetCameraZ - startCameraZ) * eased;
                camera.position.x = fragment.mesh.position.x * eased;
                camera.position.y = fragment.mesh.position.y * eased;

                // Fade out other fragments
                fragments.forEach(f => {
                    if (f !== fragment) {
                        f.mesh.material.opacity = 1 - eased;
                        f.mesh.material.transparent = true;
                    }
                });

                if (progress < 1) {
                    requestAnimationFrame(zoomAnimate);
                } else {
                    // Clear fragments
                    fragments.forEach(f => scene.remove(f.mesh));
                    fragments = [];

                    // Remove film grain filter when entering scene
                    document.getElementById('canvas').classList.remove('shattered');

                    // Create scene
                    createSceneEnvironment(sceneData, fragment);

                    // Reset camera
                    camera.position.set(0, 0, 5);

                    // Enable OrbitControls for looking around
                    if (!controls) {
                        controls = new THREE.OrbitControls(camera, renderer.domElement);
                    }
                    controls.enabled = true;
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    controls.minDistance = 3;
                    controls.maxDistance = 10;

                    currentState = STATE.SCENE;
                    window.currentSceneIndex = fragment.sceneIndex;
                    document.getElementById('back-button').classList.add('visible');

                    const sceneTitle = document.getElementById('scene-title');
                    sceneTitle.textContent = sceneData.name;
                    sceneTitle.classList.add('visible');

                    // Show progress
                    const sceneProgress = document.getElementById('scene-progress');
                    sceneProgress.textContent = `Collected ${completedScenes.size}/${scenes.length}`;
                    sceneProgress.classList.add('visible');

                    // Show scene hint
                    document.getElementById('scene-hint').classList.add('visible');
                }
            }

            zoomAnimate();
        }

        // Create a scene environment
        function createSceneEnvironment(sceneData, fragment) {
            // Clear previous scene
            if (currentScene) {
                currentScene.forEach(obj => scene.remove(obj));
            }
            currentScene = [];

            // Clear previous fragment shape
            if (sceneFragmentShape) {
                scene.remove(sceneFragmentShape);
                sceneFragmentShape = null;
            }

            // Update fog and background
            scene.fog = new THREE.Fog(sceneData.fogColor, 5, 30);
            scene.background = new THREE.Color(sceneData.color);

            // Update lighting
            const ambientLight = new THREE.AmbientLight(sceneData.ambientLight, 0.6);
            currentScene.push(ambientLight);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            currentScene.push(directionalLight);
            scene.add(directionalLight);

            // Create glowing clickable fragment shape in the scene
            createSceneFragmentShape(fragment, sceneData);

            // Create environment based on filter type
            switch(sceneData.filter) {
                case 'cold':
                    createColdEnvironment();
                    break;
                case 'warm':
                    createWarmEnvironment();
                    break;
                case 'noir':
                    createNoirEnvironment();
                    break;
                case 'dreamy':
                    createDreamyEnvironment();
                    break;
                case 'infinity':
                    createInfinityEnvironment();
                    break;
                case 'twilight':
                    createTwilightEnvironment();
                    break;
                case 'echo':
                    createEchoEnvironment();
                    break;
            }
        }

        // Create clickable fragment shape in the scene
        function createSceneFragmentShape(fragment, sceneData) {
            // Clone the fragment geometry and scale it down
            const fragmentGeometry = fragment.mesh.geometry.clone();

            // Black material for the core
            const fragmentMaterial = new THREE.MeshStandardMaterial({
                color: 0x000000,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0x000000,
                emissiveIntensity: 0
            });

            sceneFragmentShape = new THREE.Mesh(fragmentGeometry, fragmentMaterial);

            // Make it smaller
            sceneFragmentShape.scale.set(0.4, 0.4, 0.4);

            // Position fragment shape farther away in the scene
            const angle = Math.random() * Math.PI * 2;
            const distance = 6 + Math.random() * 4; // Farther: 6-10 units away
            sceneFragmentShape.position.set(
                Math.cos(angle) * distance,
                (Math.random() - 0.5) * 5,
                Math.sin(angle) * distance
            );

            // Fixed rotation - no spinning
            sceneFragmentShape.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );

            sceneFragmentShape.userData.isFragmentShape = true;
            sceneFragmentShape.userData.floatOffset = Math.random() * Math.PI * 2;
            sceneFragmentShape.userData.baseY = sceneFragmentShape.position.y;

            // Create glowing outline using a wireframe
            const outlineGeometry = fragmentGeometry.clone();
            const outlineMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                wireframe: true,
                wireframeLinewidth: 2
            });
            const outline = new THREE.Mesh(outlineGeometry, outlineMaterial);
            outline.scale.set(1.05, 1.05, 1.05); // Slightly larger for outline effect
            sceneFragmentShape.add(outline);

            // Add point light for glow effect
            const glowLight = new THREE.PointLight(0xffffff, 1, 3);
            glowLight.position.set(0, 0, 0);
            sceneFragmentShape.add(glowLight);

            scene.add(sceneFragmentShape);
        }

        // Restore complete mirror when all scenes are done
        function restoreMirror() {
            currentState = STATE.TRANSITIONING;

            // Animate all fragments back to center
            const duration = 2000;
            const startTime = Date.now();
            const startPositions = fragments.map(f => ({
                x: f.mesh.position.x,
                y: f.mesh.position.y,
                z: f.mesh.position.z,
                rx: f.mesh.rotation.x,
                ry: f.mesh.rotation.y,
                rz: f.mesh.rotation.z
            }));

            // Camera animation back to original position
            const startCameraZ = camera.position.z;
            const targetCameraZ = 5;

            function animateRestore() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                // Animate fragments
                fragments.forEach((f, i) => {
                    const start = startPositions[i];
                    f.mesh.position.x = start.x * (1 - eased);
                    f.mesh.position.y = start.y * (1 - eased);
                    f.mesh.position.z = start.z * (1 - eased);
                    f.mesh.rotation.x = start.rx * (1 - eased);
                    f.mesh.rotation.y = start.ry * (1 - eased);
                    f.mesh.rotation.z = start.rz * (1 - eased);
                });

                // Animate camera zoom out
                camera.position.z = startCameraZ + (targetCameraZ - startCameraZ) * eased;

                if (progress < 1) {
                    requestAnimationFrame(animateRestore);
                } else {
                    // Remove fragments and show complete mirror
                    fragments.forEach(f => scene.remove(f.mesh));
                    fragments = [];

                    createMirror();
                    currentState = STATE.MIRROR;

                    // Remove film grain filter - background becomes bright again
                    document.getElementById('canvas').classList.remove('shattered');

                    // Show completion message
                    document.getElementById('title').textContent = 'All Reflections Restored';
                    document.getElementById('title').classList.remove('hidden');
                    document.getElementById('instruction').textContent = 'Click to shatter again';
                    document.getElementById('instruction').classList.remove('hidden');

                    // Reset completed scenes and fragment data for replay
                    completedScenes.clear();
                    initialFragmentData = [];
                }
            }

            animateRestore();
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Update fragment hover effects
            if (currentState === STATE.FRAGMENTS) {
                fragments.forEach(fragment => {
                    if (fragment.completed) {
                        // Completed fragments glow brightly
                        fragment.mesh.material.emissive.setHex(0xffffff);
                        fragment.mesh.material.emissiveIntensity = 0.5 + Math.sin(time * 3) * 0.3; // Pulsing glow
                    } else if (fragment.hovered) {
                        // Static gradient glow (no pulse)
                        fragment.mesh.material.emissive.setHex(0xccddff);
                        fragment.mesh.material.emissiveIntensity = 0.4;

                        // Gentle sway (left-right tilt) on top of rest rotation
                        const swayAmount = 0.08;
                        fragment.mesh.rotation.z = fragment.restRotation.z + Math.sin(time * 2 + fragment.swayPhase) * swayAmount;
                    } else {
                        // Reset
                        fragment.mesh.material.emissive.setHex(0x111111);
                        fragment.mesh.material.emissiveIntensity = 0.1;

                        // Return to rest rotation (smoothly)
                        fragment.mesh.rotation.x += (fragment.restRotation.x - fragment.mesh.rotation.x) * 0.1;
                        fragment.mesh.rotation.y += (fragment.restRotation.y - fragment.mesh.rotation.y) * 0.1;
                        fragment.mesh.rotation.z += (fragment.restRotation.z - fragment.mesh.rotation.z) * 0.1;
                    }
                });
            }

            // Animate scene objects
            if (currentState === STATE.SCENE && currentScene) {
                const time = Date.now() * 0.001;

                currentScene.forEach(obj => {
                    // Rotation
                    if (obj.userData.rotationSpeed) {
                        obj.rotation.x += obj.userData.rotationSpeed.x;
                        obj.rotation.y += obj.userData.rotationSpeed.y;
                        obj.rotation.z += obj.userData.rotationSpeed.z;
                    }

                    // Floating
                    if (obj.userData.float) {
                        const float = obj.userData.float;
                        obj.position.y += Math.sin(time * float.speed + float.offset) *
                            float.amplitude * 0.01;
                    }

                    // Pulse
                    if (obj.userData.pulse) {
                        const scale = 1 + Math.sin(time * 2) * 0.05;
                        obj.scale.set(scale, scale, scale);
                    }

                    // Orbiting sphere (for Twilight scene)
                    if (obj.userData.isOrbiting) {
                        const orbitAngle = time * obj.userData.orbitSpeed;
                        obj.position.x = Math.cos(orbitAngle) * 2;
                        obj.position.z = Math.sin(orbitAngle) * 2;
                    }

                    // Wave ring particles (for Echo scene)
                    if (obj.userData.waveRing) {
                        // Create ripple effect - particles oscillate up/down with phase delay
                        const wavePhase = time * 2 + obj.userData.waveLayer * 0.3;
                        const verticalWave = Math.sin(wavePhase + obj.userData.waveAngle * 2) * 0.2;
                        obj.position.y = obj.userData.baseY + verticalWave;

                        // Slight radial expansion/contraction
                        const radiusWave = 1 + Math.sin(wavePhase) * 0.08;
                        const newRadius = obj.userData.baseRadius * radiusWave;
                        obj.position.x = Math.cos(obj.userData.waveAngle) * newRadius;
                        obj.position.z = Math.sin(obj.userData.waveAngle) * newRadius;

                        // Subtle pulse
                        const pulseScale = 1 + Math.sin(wavePhase * 1.5) * 0.15;
                        obj.scale.set(pulseScale, pulseScale, pulseScale);
                    }
                });

                // Animate fragment shape in scene - only float up and down
                if (sceneFragmentShape && sceneFragmentShape.userData.floatOffset !== undefined) {
                    const floatAmount = Math.sin(time * 0.8 + sceneFragmentShape.userData.floatOffset) * 0.3;
                    sceneFragmentShape.position.y = sceneFragmentShape.userData.baseY + floatAmount;
                }
            }

            // Update OrbitControls
            if (controls && controls.enabled) {
                controls.update();
            }

            // Gentle mirror rotation in initial state
            if (currentState === STATE.MIRROR && mirror) {
                mirror.rotation.y = Math.sin(Date.now() * 0.0005) * 0.1;
            }

            renderer.render(scene, camera);
        }

        // Window resize handler
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start the experience
        init();
    </script>
</body>
</html>
