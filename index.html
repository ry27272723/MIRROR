<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shattered Mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            background: linear-gradient(135deg, #2a2a3e 0%, #3a4a5e 100%);
            cursor: default;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #back-button {
            position: absolute;
            top: 40px;
            left: 40px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 16px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border-radius: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateX(-5px);
        }

        #back-button.visible {
            opacity: 1;
        }

        #title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 48px;
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
        }

        #title.hidden {
            opacity: 0;
        }

        #instruction {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
            letter-spacing: 2px;
        }

        #instruction.hidden {
            opacity: 0;
        }

        .scene-title {
            position: absolute;
            top: 40px;
            right: 40px;
            color: white;
            font-size: 24px;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
            pointer-events: none;
        }

        .scene-title.visible {
            opacity: 1;
        }

        #fragment-description {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            letter-spacing: 1px;
            max-width: 500px;
            line-height: 1.6;
            font-style: italic;
        }

        #fragment-description.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui-overlay">
        <div id="title">The Shattered Mirror</div>
        <div id="instruction">Click the mirror to shatter it</div>
        <button id="back-button">← Back</button>
        <div id="scene-title" class="scene-title"></div>
        <div id="fragment-description"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // State management
        const STATE = {
            MIRROR: 'mirror',
            FRAGMENTS: 'fragments',
            SCENE: 'scene',
            TRANSITIONING: 'transitioning'
        };

        let currentState = STATE.MIRROR;
        let scene, camera, renderer, raycaster, mouse;
        let mirror, fragments = [];
        let currentScene = null;
        let hoveredFragment = null;

        // Scene definitions
        const scenes = [
            {
                name: 'Frozen Memory',
                description: 'A world suspended in ice, where time crystallizes into still moments',
                color: 0x4a90e2,
                filter: 'cold',
                fogColor: 0x89CFF0,
                ambientLight: 0x6699cc
            },
            {
                name: 'Golden Hours',
                description: 'Warm light filtered through nostalgia, soft and sepia-toned',
                color: 0xe8a735,
                filter: 'warm',
                fogColor: 0xffd9a3,
                ambientLight: 0xffaa55
            },
            {
                name: 'Shadow Play',
                description: 'Stark contrasts dance in monochrome, a film noir reverie',
                color: 0x2a2a2a,
                filter: 'noir',
                fogColor: 0x333333,
                ambientLight: 0x444444
            },
            {
                name: 'Dream Drift',
                description: 'Reality bends and softens at the edges, ethereal and weightless',
                color: 0xb19cd9,
                filter: 'dreamy',
                fogColor: 0xdda0dd,
                ambientLight: 0xaa88cc
            }
        ];

        // Initialize
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x3a4a5e, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('canvas'),
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Raycaster for mouse interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Create initial mirror
            createMirror();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onClick);
            window.addEventListener('mousemove', onMouseMove);
            document.getElementById('back-button').addEventListener('click', onBackClick);

            // Start animation loop
            animate();
        }

        // Create the initial mirror
        function createMirror() {
            const geometry = new THREE.PlaneGeometry(3, 4, 1, 1);
            const material = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                metalness: 1,
                roughness: 0.1,
                emissive: 0x222222
            });

            mirror = new THREE.Mesh(geometry, material);
            scene.add(mirror);

            // Add frame
            const frameGeometry = new THREE.PlaneGeometry(3.3, 4.3, 1, 1);
            const frameMaterial = new THREE.MeshStandardMaterial({
                color: 0x3a3a3a,
                metalness: 0.8,
                roughness: 0.3
            });
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.position.z = -0.1;
            mirror.add(frame);

            // Lighting for mirror - soft and even
            const ambientLight = new THREE.AmbientLight(0x808080, 1.2);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight1.position.set(5, 5, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xaaaaff, 0.3);
            directionalLight2.position.set(-5, -3, 3);
            scene.add(directionalLight2);
        }

        // Shatter the mirror into fragments
        function shatterMirror() {
            if (currentState !== STATE.MIRROR) return;

            currentState = STATE.TRANSITIONING;
            document.getElementById('title').classList.add('hidden');
            document.getElementById('instruction').classList.add('hidden');

            // Remove original mirror
            scene.remove(mirror);

            // Create irregular fragments
            const fragmentCount = 6;
            const mirrorPos = { x: 0, y: 0, z: 0 };

            for (let i = 0; i < fragmentCount; i++) {
                const fragment = createFragment(i, fragmentCount);
                fragments.push(fragment);
                scene.add(fragment.mesh);

                // Animate fragment breaking apart
                animateFragmentShatter(fragment, i);
            }

            setTimeout(() => {
                currentState = STATE.FRAGMENTS;
            }, 1500);
        }

        // Create an irregular fragment
        function createFragment(index, total) {
            // Create irregular shape
            const shape = new THREE.Shape();
            const points = 6;
            const baseRadius = 0.4;

            for (let i = 0; i < points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const radius = baseRadius * (0.7 + Math.random() * 0.6);
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;

                if (i === 0) {
                    shape.moveTo(x, y);
                } else {
                    shape.lineTo(x, y);
                }
            }
            shape.closePath();

            const extrudeSettings = {
                depth: 0.05,
                bevelEnabled: true,
                bevelThickness: 0.02,
                bevelSize: 0.02,
                bevelSegments: 2
            };

            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const material = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                metalness: 1,
                roughness: 0.1,
                emissive: 0x111111,
                side: THREE.DoubleSide
            });

            const mesh = new THREE.Mesh(geometry, material);

            // Position 6 fragments in a scattered pattern (spreading from center)
            const positions = [
                { x: -1.0, y: 1.2 },   // Top left
                { x: 1.0, y: 1.2 },    // Top right
                { x: -1.4, y: 0 },     // Middle left
                { x: 1.4, y: 0 },      // Middle right
                { x: -1.0, y: -1.2 },  // Bottom left
                { x: 1.0, y: -1.2 }    // Bottom right
            ];

            const startPos = positions[index];
            mesh.position.set(startPos.x, startPos.y, 0);

            // Target positions spread out moderately
            const spreadFactor = 2.0;
            const targetX = startPos.x * spreadFactor + (Math.random() - 0.5) * 0.6;
            const targetY = startPos.y * spreadFactor + (Math.random() - 0.5) * 0.6;

            return {
                mesh: mesh,
                originalPos: { x: startPos.x, y: startPos.y, z: 0 },
                targetPos: {
                    x: targetX,
                    y: targetY,
                    z: (Math.random() - 0.5) * 1.2
                },
                rotation: {
                    x: (Math.random() - 0.5) * 0.5,
                    y: (Math.random() - 0.5) * 0.5,
                    z: (Math.random() - 0.5) * 0.5
                },
                sceneIndex: index % scenes.length,
                hovered: false
            };
        }

        // Animate fragment shattering
        function animateFragmentShatter(fragment, index) {
            const duration = 1000;
            const delay = index * 50;
            const startTime = Date.now() + delay;

            function animate() {
                const now = Date.now();
                const elapsed = now - startTime;

                if (elapsed < 0) {
                    requestAnimationFrame(animate);
                    return;
                }

                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    const eased = easeOutCubic(progress);

                    fragment.mesh.position.x = fragment.originalPos.x +
                        (fragment.targetPos.x - fragment.originalPos.x) * eased;
                    fragment.mesh.position.y = fragment.originalPos.y +
                        (fragment.targetPos.y - fragment.originalPos.y) * eased;
                    fragment.mesh.position.z = fragment.originalPos.z +
                        (fragment.targetPos.z - fragment.originalPos.z) * eased;

                    fragment.mesh.rotation.x = fragment.rotation.x * eased;
                    fragment.mesh.rotation.y = fragment.rotation.y * eased;
                    fragment.mesh.rotation.z = fragment.rotation.z * eased;

                    requestAnimationFrame(animate);
                }
            }

            animate();
        }

        // Easing function
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Handle mouse move for hover effects
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (currentState === STATE.FRAGMENTS) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(fragments.map(f => f.mesh));

                const descriptionElement = document.getElementById('fragment-description');

                // Reset previous hovered fragment
                if (hoveredFragment && !intersects.find(i => i.object === hoveredFragment.mesh)) {
                    hoveredFragment.hovered = false;
                    hoveredFragment = null;
                    descriptionElement.classList.remove('visible');
                }

                // Set new hovered fragment
                if (intersects.length > 0) {
                    const fragment = fragments.find(f => f.mesh === intersects[0].object);
                    if (fragment) {
                        fragment.hovered = true;
                        hoveredFragment = fragment;
                        document.body.style.cursor = 'pointer';

                        // Show scene description
                        const sceneData = scenes[fragment.sceneIndex];
                        descriptionElement.textContent = sceneData.description;
                        descriptionElement.classList.add('visible');
                    }
                } else {
                    document.body.style.cursor = 'default';
                    descriptionElement.classList.remove('visible');
                }
            }
        }

        // Handle click events
        function onClick(event) {
            if (currentState === STATE.MIRROR) {
                shatterMirror();
            } else if (currentState === STATE.FRAGMENTS) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(fragments.map(f => f.mesh));

                if (intersects.length > 0) {
                    const fragment = fragments.find(f => f.mesh === intersects[0].object);
                    if (fragment) {
                        transitionToScene(fragment);
                    }
                }
            }
        }

        // Transition from fragment to scene
        function transitionToScene(fragment) {
            if (currentState !== STATE.FRAGMENTS) return;

            currentState = STATE.TRANSITIONING;
            document.body.style.cursor = 'default';
            document.getElementById('fragment-description').classList.remove('visible');

            const sceneData = scenes[fragment.sceneIndex];
            const duration = 1500;
            const startTime = Date.now();
            const startCameraZ = camera.position.z;
            const targetCameraZ = fragment.mesh.position.z + 0.5;

            // Zoom animation
            function zoomAnimate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                // Zoom camera to fragment
                camera.position.z = startCameraZ + (targetCameraZ - startCameraZ) * eased;
                camera.position.x = fragment.mesh.position.x * eased;
                camera.position.y = fragment.mesh.position.y * eased;

                // Fade out other fragments
                fragments.forEach(f => {
                    if (f !== fragment) {
                        f.mesh.material.opacity = 1 - eased;
                        f.mesh.material.transparent = true;
                    }
                });

                if (progress < 1) {
                    requestAnimationFrame(zoomAnimate);
                } else {
                    // Clear fragments
                    fragments.forEach(f => scene.remove(f.mesh));
                    fragments = [];

                    // Create scene
                    createSceneEnvironment(sceneData);

                    // Reset camera
                    camera.position.set(0, 0, 5);

                    currentState = STATE.SCENE;
                    document.getElementById('back-button').classList.add('visible');

                    const sceneTitle = document.getElementById('scene-title');
                    sceneTitle.textContent = sceneData.name;
                    sceneTitle.classList.add('visible');
                }
            }

            zoomAnimate();
        }

        // Create a scene environment
        function createSceneEnvironment(sceneData) {
            // Clear previous scene
            if (currentScene) {
                currentScene.forEach(obj => scene.remove(obj));
            }
            currentScene = [];

            // Update fog and background
            scene.fog = new THREE.Fog(sceneData.fogColor, 5, 30);
            scene.background = new THREE.Color(sceneData.color);

            // Update lighting
            const ambientLight = new THREE.AmbientLight(sceneData.ambientLight, 0.6);
            currentScene.push(ambientLight);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            currentScene.push(directionalLight);
            scene.add(directionalLight);

            // Create environment based on filter type
            switch(sceneData.filter) {
                case 'cold':
                    createColdEnvironment();
                    break;
                case 'warm':
                    createWarmEnvironment();
                    break;
                case 'noir':
                    createNoirEnvironment();
                    break;
                case 'dreamy':
                    createDreamyEnvironment();
                    break;
            }
        }

        // Cold blue ice environment
        function createColdEnvironment() {
            // Floating ice crystals
            for (let i = 0; i < 30; i++) {
                const geometry = new THREE.OctahedronGeometry(0.1 + Math.random() * 0.1);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x9dcff0,
                    metalness: 0.8,
                    roughness: 0.2,
                    transparent: true,
                    opacity: 0.7
                });
                const crystal = new THREE.Mesh(geometry, material);

                crystal.position.set(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20
                );
                crystal.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );

                crystal.userData.rotationSpeed = {
                    x: (Math.random() - 0.5) * 0.01,
                    y: (Math.random() - 0.5) * 0.01,
                    z: (Math.random() - 0.5) * 0.01
                };

                currentScene.push(crystal);
                scene.add(crystal);
            }

            // Central frozen orb
            const orbGeometry = new THREE.IcosahedronGeometry(1, 1);
            const orbMaterial = new THREE.MeshStandardMaterial({
                color: 0x6ba3d4,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0x2a5a7a,
                emissiveIntensity: 0.3
            });
            const orb = new THREE.Mesh(orbGeometry, orbMaterial);
            orb.userData.rotationSpeed = { x: 0.002, y: 0.005, z: 0.001 };
            currentScene.push(orb);
            scene.add(orb);
        }

        // Warm vintage environment
        function createWarmEnvironment() {
            // Floating vintage frames and objects
            for (let i = 0; i < 20; i++) {
                const geometry = new THREE.TorusGeometry(0.3, 0.05, 8, 20);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xd4a373,
                    metalness: 0.7,
                    roughness: 0.4
                });
                const ring = new THREE.Mesh(geometry, material);

                ring.position.set(
                    (Math.random() - 0.5) * 15,
                    (Math.random() - 0.5) * 15,
                    (Math.random() - 0.5) * 15
                );
                ring.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );

                ring.userData.rotationSpeed = {
                    x: (Math.random() - 0.5) * 0.008,
                    y: (Math.random() - 0.5) * 0.008,
                    z: (Math.random() - 0.5) * 0.008
                };

                currentScene.push(ring);
                scene.add(ring);
            }

            // Central warm sphere
            const sphereGeometry = new THREE.SphereGeometry(1.2, 32, 32);
            const sphereMaterial = new THREE.MeshStandardMaterial({
                color: 0xf5c77e,
                metalness: 0.5,
                roughness: 0.5,
                emissive: 0xe8a735,
                emissiveIntensity: 0.2
            });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.userData.pulse = true;
            currentScene.push(sphere);
            scene.add(sphere);
        }

        // Film noir environment
        function createNoirEnvironment() {
            // Floating geometric shadows
            for (let i = 0; i < 25; i++) {
                const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    metalness: 0.9,
                    roughness: 0.7,
                    emissive: 0x0a0a0a
                });
                const box = new THREE.Mesh(geometry, material);

                box.position.set(
                    (Math.random() - 0.5) * 18,
                    (Math.random() - 0.5) * 18,
                    (Math.random() - 0.5) * 18
                );
                box.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );

                box.userData.rotationSpeed = {
                    x: (Math.random() - 0.5) * 0.012,
                    y: (Math.random() - 0.5) * 0.012,
                    z: (Math.random() - 0.5) * 0.012
                };

                currentScene.push(box);
                scene.add(box);
            }

            // Central dark cube
            const cubeGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const cubeMaterial = new THREE.MeshStandardMaterial({
                color: 0x3a3a3a,
                metalness: 0.95,
                roughness: 0.2,
                emissive: 0x1a1a1a,
                emissiveIntensity: 0.5
            });
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            cube.userData.rotationSpeed = { x: 0.003, y: 0.006, z: 0.002 };
            currentScene.push(cube);
            scene.add(cube);
        }

        // Dreamy distorted environment
        function createDreamyEnvironment() {
            // Floating ethereal bubbles
            for (let i = 0; i < 35; i++) {
                const geometry = new THREE.SphereGeometry(0.15 + Math.random() * 0.2, 16, 16);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xd8b9f0,
                    metalness: 0.3,
                    roughness: 0.3,
                    transparent: true,
                    opacity: 0.4 + Math.random() * 0.3,
                    emissive: 0xb19cd9,
                    emissiveIntensity: 0.2
                });
                const bubble = new THREE.Mesh(geometry, material);

                bubble.position.set(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20
                );

                bubble.userData.float = {
                    speed: 0.0005 + Math.random() * 0.001,
                    offset: Math.random() * Math.PI * 2,
                    amplitude: 0.3 + Math.random() * 0.5
                };

                currentScene.push(bubble);
                scene.add(bubble);
            }

            // Central dreamy toroid
            const torusGeometry = new THREE.TorusGeometry(1, 0.3, 16, 100);
            const torusMaterial = new THREE.MeshStandardMaterial({
                color: 0xc8a8e8,
                metalness: 0.6,
                roughness: 0.2,
                emissive: 0xb19cd9,
                emissiveIntensity: 0.3
            });
            const torus = new THREE.Mesh(torusGeometry, torusMaterial);
            torus.userData.rotationSpeed = { x: 0.004, y: 0.003, z: 0.002 };
            currentScene.push(torus);
            scene.add(torus);
        }

        // Back button handler
        function onBackClick() {
            if (currentState !== STATE.SCENE) return;

            currentState = STATE.TRANSITIONING;
            document.getElementById('back-button').classList.remove('visible');
            document.getElementById('scene-title').classList.remove('visible');

            // Fade out scene
            const duration = 1000;
            const startTime = Date.now();

            function fadeOut() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                if (currentScene) {
                    currentScene.forEach(obj => {
                        if (obj.material) {
                            obj.material.transparent = true;
                            obj.material.opacity = 1 - progress;
                        }
                    });
                }

                if (progress < 1) {
                    requestAnimationFrame(fadeOut);
                } else {
                    // Clear scene
                    if (currentScene) {
                        currentScene.forEach(obj => scene.remove(obj));
                        currentScene = null;
                    }

                    // Reset scene
                    scene.background = null;
                    scene.fog = new THREE.Fog(0x3a4a5e, 10, 50);

                    // Recreate fragments
                    shatterMirror();
                }
            }

            fadeOut();
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Update fragment hover effects
            if (currentState === STATE.FRAGMENTS) {
                fragments.forEach(fragment => {
                    if (fragment.hovered) {
                        // Glow effect
                        fragment.mesh.material.emissive.setHex(0x4a90e2);
                        fragment.mesh.material.emissiveIntensity = 0.5;

                        // Gentle rotation
                        fragment.mesh.rotation.z += 0.02;
                    } else {
                        // Reset
                        fragment.mesh.material.emissive.setHex(0x111111);
                        fragment.mesh.material.emissiveIntensity = 0.1;
                    }
                });
            }

            // Animate scene objects
            if (currentState === STATE.SCENE && currentScene) {
                const time = Date.now() * 0.001;

                currentScene.forEach(obj => {
                    // Rotation
                    if (obj.userData.rotationSpeed) {
                        obj.rotation.x += obj.userData.rotationSpeed.x;
                        obj.rotation.y += obj.userData.rotationSpeed.y;
                        obj.rotation.z += obj.userData.rotationSpeed.z;
                    }

                    // Floating
                    if (obj.userData.float) {
                        const float = obj.userData.float;
                        obj.position.y += Math.sin(time * float.speed + float.offset) *
                            float.amplitude * 0.01;
                    }

                    // Pulse
                    if (obj.userData.pulse) {
                        const scale = 1 + Math.sin(time * 2) * 0.05;
                        obj.scale.set(scale, scale, scale);
                    }
                });
            }

            // Gentle mirror rotation in initial state
            if (currentState === STATE.MIRROR && mirror) {
                mirror.rotation.y = Math.sin(Date.now() * 0.0005) * 0.1;
            }

            renderer.render(scene, camera);
        }

        // Window resize handler
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start the experience
        init();
    </script>
</body>
</html>
